name: Run all_users endpoint

on:
  schedule:
    - cron: '0 10 * * FRI'
  workflow_dispatch:
    inputs:
      max_workers:
        description: 'Max workers'
        required: false
        default: '2'
      max_users:
        description: 'Max users (0 = all)'
        required: false
        default: '0'

jobs:
  call_all_users:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flask  # Ensure flask is installed

      - name: Start Flask and Call API
        env:
          # Uses localhost for the internal runner
          SERVICE_URL: http://localhost:5000
          MAX_WORKERS: ${{ github.event.inputs.max_workers || '2' }}
          MAX_USERS: ${{ github.event.inputs.max_users || '0' }}
        run: |
          set -e
          
          # 1. Start Flask in background
          python app.py & 
          
          # 2. Wait for Flask to be ready (up to 30s)
          echo "Waiting for Flask to start on port 5000..."
          timeout 30s bash -c 'until curl -s localhost:5000 > /dev/null; do sleep 1; done' || (echo "Flask failed to start" && exit 1)

          # 3. Build Payload
          PAYLOAD="{\"max_workers\": ${MAX_WORKERS}"
          [ "${MAX_USERS}" -gt 0 ] && PAYLOAD="${PAYLOAD},\"max_users\": ${MAX_USERS}"
          PAYLOAD="${PAYLOAD}}"

          # 4. Execution Loop
          HTTP=$(curl -sS -X POST "$SERVICE_URL/api/all_users" -H "Content-Type: application/json" -d "$PAYLOAD" -o response.json -w "%{http_code}") || true
          
          echo "HTTP status: $HTTP"
          cat response.json

          # 5. Exit Check
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            exit 1
          fi