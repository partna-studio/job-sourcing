name: Run all_users endpoint

on:
  schedule:
    - cron: "0 10 * * FRI"
  workflow_dispatch:
    inputs:
      max_workers:
        description: "Max workers"
        required: false
        default: "2"
      max_users:
        description: "Max users (0 = all)"
        required: false
        default: "0"

jobs:
  call_all_users:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        env:
          DIGISTUDIO_TOKEN: ${{ secrets.DIGISTUDIO_TOKEN }}
        run: |
          sed -i "s/\${DIGISTUDIO_TOKEN}/$DIGISTUDIO_TOKEN/g" requirements.txt
          pip install -r requirements.txt
          pip install flask

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Start Flask and Call API
        env:
          # Uses localhost for the internal runner
          SERVICE_URL: http://localhost:5000
          INP_LI: ${{ github.event.inputs.li_token }}
          INP_JS: ${{ github.event.inputs.j_session_id }}
          SEC_LI: ${{ secrets.LI_TOKEN }}
          SEC_JS: ${{ secrets.JSESSION_ID }}
          MAX_WORKERS: ${{ github.event.inputs.max_workers || '2' }}
          MAX_USERS: ${{ github.event.inputs.max_users || '0' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -e

          # 1. Determine which tokens to use and EXPORT them for the Python process
          if [ "$USE_SECRETS" = "true" ]; then
            export LI_TOKEN="$SEC_LI"
            export JSESSION_ID="$SEC_JS"
          else
            export LI_TOKEN="$INP_LI"
            export JSESSION_ID="$INP_JS"
          fi

          # 1. Start Flask in background
          python app.py & 

          # 2. Wait for Flask to be ready
          timeout 30s bash -c 'until curl -s localhost:5000 > /dev/null; do sleep 1; done'

          # 3. Build Payload
          PAYLOAD="{\"max_workers\": ${MAX_WORKERS}"
          if [ "${MAX_USERS}" -gt 0 ]; then
            PAYLOAD="${PAYLOAD}, \"max_users\": ${MAX_USERS}"
          fi
          PAYLOAD="${PAYLOAD}}"

          # 4. Call API
          echo "Calling API at $SERVICE_URL/api/all_users..."
          HTTP=$(curl -sS -X POST "$SERVICE_URL/api/all_users" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            -o response.json \
            -w "%{http_code}") || true

          echo "HTTP status: $HTTP"
          cat response.json

          # 5. Exit Check
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "API call failed with status $HTTP"
            exit 1
          fi
