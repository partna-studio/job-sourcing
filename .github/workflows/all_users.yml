name: Run all_users endpoint

on:
  schedule:
    # Runs Fridays at 05:00 AM EST -> 10:00 UTC (adjust for DST if needed)
    - cron: '0 10 * * FRI'
  workflow_dispatch:
    inputs:
      max_workers:
        description: 'Max workers for concurrent processing'
        required: false
        default: '2'
      max_users:
        description: 'Maximum users to process (0 = all)'
        required: false
        default: '0'
      uri:
        description: 'Optional URI override for job fetch'
        required: false
        default: ''

jobs:
  call_all_users:
    runs-on: ubuntu-latest
    steps:
      - name: Call `/api/all_users`
        env:
          SERVICE_URL: ${{ secrets.SERVICE_URL }}
          MAX_WORKERS: ${{ github.event.inputs.max_workers || secrets.DEFAULT_MAX_WORKERS || '2' }}
          MAX_USERS: ${{ github.event.inputs.max_users || secrets.DEFAULT_MAX_USERS || '0' }}
          URI_INPUT: ${{ github.event.inputs.uri || '' }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK || '' }}
          RETRY_ATTEMPTS: ${{ secrets.RETRY_ATTEMPTS || '3' }}
          RETRY_SLEEP: ${{ secrets.RETRY_SLEEP || '10' }}
        run: |
          set -e
          if [ -z "$SERVICE_URL" ]; then
            echo "ERROR: Set SERVICE_URL repository secret to the base URL of your service (e.g. https://example.com)" >&2
            exit 1
          fi
          # Build JSON payload using shell (avoid YAML heredoc parsing issues)
          PAYLOAD="{\"max_workers\": ${MAX_WORKERS}"
          if [ "${MAX_USERS}" -gt 0 ]; then
            PAYLOAD="${PAYLOAD},\"max_users\": ${MAX_USERS}"
          fi
          if [ -n "${URI_INPUT}" ]; then
            # Escape backslashes and double quotes in URI_INPUT
            esc_uri=$(printf '%s' "${URI_INPUT}" | sed 's/\\/\\\\/g; s/"/\\\"/g')
            PAYLOAD="${PAYLOAD},\"uri\": \"${esc_uri}\""
          fi
          PAYLOAD="${PAYLOAD}}"
          echo "Payload: $PAYLOAD"

          attempts=${RETRY_ATTEMPTS:-3}
          sleep_seconds=${RETRY_SLEEP:-10}
          attempt=1
          HTTP=0
          while [ $attempt -le $attempts ]; do
            echo "Attempt $attempt/$attempts..."
            HTTP=$(curl -sS -X POST "$SERVICE_URL/api/all_users" -H "Content-Type: application/json" -d "$PAYLOAD" -o response.json -w "%{http_code}") || true
            echo "HTTP status: $HTTP"
            if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
              echo "Success (HTTP $HTTP)"
              break
            fi
            echo "Request failed (HTTP $HTTP); sleeping ${sleep_seconds}s and retrying..."
            attempt=$((attempt+1))
            sleep $sleep_seconds
          done

          if [ "$attempt" -gt "$attempts" ] && [ -n "$NOTIFY_WEBHOOK" ]; then
            # include the response body (base64-encoded) to avoid JSON nesting/escaping issues
            if [ -f response.json ]; then
              resp_b64=$(base64 -w0 response.json || base64 response.json | tr -d '\n')
            else
              resp_b64=""
            fi
            body=$(jq -c -n --arg wf "all_users" --arg status "failed" --arg http "$HTTP" --arg resp "$resp_b64" '{workflow: $wf, status: $status, http: $http, response_b64: $resp}')
            curl -sS -X POST -H "Content-Type: application/json" -d "$body" "$NOTIFY_WEBHOOK" || true
          fi

          echo "Response body:" && cat response.json
