name: Run jobs endpoint (manual)

on:
  workflow_dispatch:
    inputs:
      use_secrets:
        description: 'Use secrets? true/false'
        required: false
        default: 'true'
      li_token:
        description: 'LinkedIn li_at'
        required: false
      j_session_id:
        description: 'LinkedIn JSESSIONID'
        required: false

jobs:
  call_jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        env:
          DIGISTUDIO_TOKEN: ${{ secrets.DIGISTUDIO_TOKEN }}
        run: |
          sed -i "s/\${DIGISTUDIO_TOKEN}/$DIGISTUDIO_TOKEN/g" requirements.txt
          pip install -r requirements.txt
          pip install flask

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env
        
      - name: Start Flask and Call API
        env:
          SERVICE_URL: http://localhost:5000
          # Map inputs and secrets to temp variables
          INP_LI: ${{ github.event.inputs.li_token }}
          INP_JS: ${{ github.event.inputs.j_session_id }}
          SEC_LI: ${{ secrets.LI_TOKEN }}
          SEC_JS: ${{ secrets.JSESSION_ID }}
          USE_SECRETS: ${{ github.event.inputs.use_secrets }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -e

          # 1. Determine which tokens to use and EXPORT them for the Python process
          if [ "$USE_SECRETS" = "true" ]; then
            export LI_TOKEN="$SEC_LI"
            export JSESSION_ID="$SEC_JS"
          else
            export LI_TOKEN="$INP_LI"
            export JSESSION_ID="$INP_JS"
          fi

          # 2. Start Flask (It will now inherit the exported LI_TOKEN and JSESSION_ID)
          python app.py & 
          
          # 3. Wait for Flask to be ready
          timeout 30s bash -c 'until curl -s localhost:5000 > /dev/null; do sleep 1; done'

          # 4. Build Payload for the curl call
          # Escaping quotes in case tokens contain them
          esc_li=$(printf '%s' "$LI_TOKEN" | sed 's/\\/\\\\/g; s/"/\\\"/g')
          esc_js=$(printf '%s' "$JSESSION_ID" | sed 's/\\/\\\\/g; s/"/\\\"/g')
          PAYLOAD="{\"li_token\": \"${esc_li}\", \"j_session_id\": \"${esc_js}\"}"

          # 5. Call API
          echo "Calling API at $SERVICE_URL/api/jobs..."
          HTTP=$(curl -sS -X POST "$SERVICE_URL/api/jobs" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            -o response.json \
            -w "%{http_code}") || true
          
          echo "HTTP status: $HTTP"
          cat response.json

          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "API call failed with status $HTTP"
            exit 1
          fi