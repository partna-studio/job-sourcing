name: Run jobs endpoint (manual)

on:
  workflow_dispatch:
    inputs:
      use_secrets:
        description: 'Use secrets? true/false'
        required: false
        default: 'true'
      li_token:
        description: 'LinkedIn li_at'
        required: false
      j_session_id:
        description: 'LinkedIn JSESSIONID'
        required: false

jobs:
  call_jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        env:
          DIGISTUDIO_TOKEN: ${{ secrets.DIGISTUDIO_TOKEN }}
        run: |
          # Replace the placeholder in requirements.txt with the actual token
          sed -i "s/\${DIGISTUDIO_TOKEN}/$DIGISTUDIO_TOKEN/g" requirements.txt
          
          pip install -r requirements.txt
          pip install flask

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env
      
      - name: Debug File Path
        run: find . -name "*.csv"
        
      - name: Start Flask and Call API
        env:
          SERVICE_URL: http://localhost:5000
          LI_TOKEN_INPUT: ${{ github.event.inputs.li_token }}
          JSESSION_INPUT: ${{ github.event.inputs.j_session_id }}
          USE_SECRETS: ${{ github.event.inputs.use_secrets }}
          LI_TOKEN_SECRET: ${{ secrets.LI_TOKEN }}
          JSESSION_SECRET: ${{ secrets.JSESSION_ID }}
          NVIDIA_API_KEY: ${{ vars.NVIDIA_API_KEY }}
        run: |
          set -e
          
          # Start Flask
          python app.py & 
          timeout 30s bash -c 'until curl -s localhost:5000 > /dev/null; do sleep 1; done'

          # Determine Tokens
          if [ "$USE_SECRETS" = "true" ]; then
            LI_TOKEN="$LI_TOKEN_SECRET"
            JSESSION="$JSESSION_SECRET"
          else
            LI_TOKEN="$LI_TOKEN_INPUT"
            JSESSION="$JSESSION_INPUT"
          fi

          # Build Payload
          esc_li=$(printf '%s' "$LI_TOKEN" | sed 's/\\/\\\\/g; s/"/\\\"/g')
          esc_js=$(printf '%s' "$JSESSION" | sed 's/\\/\\\\/g; s/"/\\\"/g')
          PAYLOAD="{\"li_token\": \"${esc_li}\", \"j_session_id\": \"${esc_js}\"}"

          # Call API
          HTTP=$(curl -sS -X POST "$SERVICE_URL/api/jobs" -H "Content-Type: application/json" -d "$PAYLOAD" -o response.json -w "%{http_code}") || true
          
          echo "HTTP status: $HTTP"
          cat response.json

          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            exit 1
          fi